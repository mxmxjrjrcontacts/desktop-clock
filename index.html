<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dabi Clock, Calendar & Stream Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            background-color: #0b0f19;
            background-image: url('dabimyhero.png');
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(11, 15, 25, 0.85) 0%, rgba(11, 15, 25, 0.6) 55%, rgba(11, 15, 25, 0.15) 100%);
            z-index: 0;
        }

        .main-container {
            position: absolute;
            top: 50%;
            left: 3%;
            transform: translateY(-50%);
            z-index: 1;
            text-align: left;
            width: 62%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-container {
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        #clock {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        #date {
            font-size: 0.95rem;
            font-weight: 300;
            margin-top: 4px;
            color: #cbd5e1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5px 8px;
            border-radius: 6px;
            width: 100%;
        }

        .music-player input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 4px 8px;
            color: #ffffff;
            font-size: 0.75rem;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .music-player input[type="text"]::placeholder {
            color: #cbd5e1;
        }

        .music-player button {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 4px;
            width: 28px;
            height: 26px;
            color: #38bdf8;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .music-player button:hover {
            background: rgba(56, 189, 248, 0.4);
        }

        .music-player button.active {
            background: rgba(56, 189, 248, 0.6);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        #player-wrapper {
            display: none;
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .calendar-year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        .month-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 5px 7px;
            text-align: left;
        }

        .month-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 3px;
            color: #38bdf8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .weekdays-row, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.58rem;
            text-align: center;
        }

        .weekdays-row div {
            font-weight: 600;
            color: #94a3b8;
            padding-bottom: 2px;
        }

        .weekdays-row div:nth-child(6), 
        .weekdays-row div:nth-child(7) {
            color: #f87171;
        }

        .days-grid div {
            padding: 1px 0;
            margin: 0.5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
        }

        .days-grid .weekend {
            color: #f87171;
            font-weight: 500;
        }

        .days-grid .empty {
            visibility: hidden;
        }

        .days-grid .today {
            border: 1.5px solid #ef4444;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.35);
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-container">
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">Loading...</div>
        </div>

        <div class="music-player">
            <input type="text" id="youtube-url" placeholder="Paste YouTube link here...">
            <button onclick="playAudioStream()" title="Play">▶</button>
            <button onclick="toggleLoop()" id="loop-btn" class="active" title="Toggle Loop">🔁</button>
            <button onclick="stopAudioStream()" title="Stop">⏹</button>
        </div>

        <div id="player-wrapper">
            <div id="player-slot" style="width:100%; height:100%;"></div>
        </div>

        <div class="calendar-year-grid" id="year-calendar"></div>
    </div>

    <script>
        let isLoopEnabled = true;

        function updateClockAndCalendar() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, dateOptions);

            generateFullYearCalendar(now);
        }

        function generateFullYearCalendar(currentDate) {
            const yearContainer = document.getElementById('year-calendar');
            if (yearContainer.children.length > 0) return;

            const year = currentDate.getFullYear();
            const currentMonthIndex = currentDate.getMonth();
            const currentDayNum = currentDate.getDate();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dayHeaders = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

            let htmlContent = '';

            for (let m = 0; m < 12; m++) {
                htmlContent += `<div class="month-card">`;
                htmlContent += `<div class="month-title">${monthNames[m]}</div>`;
                
                htmlContent += `<div class="weekdays-row">`;
                dayHeaders.forEach(d => htmlContent += `<div>${d}</div>`);
                htmlContent += `</div>`;

                htmlContent += `<div class="days-grid">`;

                let firstDayIndex = new Date(year, m, 1).getDay();
                firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

                let totalDays = new Date(year, m + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    htmlContent += `<div class="empty"></div>`;
                }

                for (let d = 1; d <= totalDays; d++) {
                    let dayOfWeek = (firstDayIndex + d - 1) % 7;
                    let isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
                    let isToday = (m === currentMonthIndex && d === currentDayNum);

                    let classes = [];
                    if (isWeekend) classes.push('weekend');
                    if (isToday) classes.push('today');

                    let classString = classes.length > 0 ? `class="${classes.join(' ')}"` : '';
                    
                    htmlContent += `<div ${classString}>${d}</div>`;
                }

                htmlContent += `</div></div>`;
            }

            yearContainer.innerHTML = htmlContent;
        }

        function extractYouTubeId(url) {
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            }
            return videoId;
        }

        function toggleLoop() {
            isLoopEnabled = !isLoopEnabled;
            const loopBtn = document.getElementById('loop-btn');
            if (isLoopEnabled) {
                loopBtn.classList.add('active');
            } else {
                loopBtn.classList.remove('active');
            }
            // If player is currently running, re-render to apply loop parameter
            const ytUrl = document.getElementById('youtube-url').value.trim();
            if (ytUrl && document.getElementById('player-wrapper').style.display === 'block') {
                playAudioStream();
            }
        }

        function playAudioStream() {
            const ytUrl = document.getElementById('youtube-url').value.trim();
            const videoId = extractYouTubeId(ytUrl);
            const wrapper = document.getElementById('player-wrapper');
            const slot = document.getElementById('player-slot');

            if (!videoId) {
                alert("Please paste a valid YouTube link.");
                return;
            }

            wrapper.style.display = "block";
            const loopParams = isLoopEnabled ? `&loop=1&playlist=${videoId}` : `&loop=0`;
            
            slot.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1${loopParams}" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function stopAudioStream() {
            document.getElementById('player-slot').innerHTML = '';
            document.getElementById('player-wrapper').style.display = 'none';
        }

        setInterval(updateClockAndCalendar, 1000);
        updateClockAndCalendar();
    </script>
</body>
</html>
