<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Anime Wallpaper Clock & Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Default Dark Mode Theme (See-Through Glassmorphic) */
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
            --text-accent: #38bdf8;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.45); /* See-through glass */
            --card-border: rgba(255, 255, 255, 0.15);
            --player-bg: rgba(15, 23, 42, 0.5);
            --input-bg: rgba(0, 0, 0, 0.3);
            --btn-bg: rgba(56, 189, 248, 0.2);
            --btn-border: rgba(56, 189, 248, 0.4);
            --btn-text: #38bdf8;
            --overlay-gradient: linear-gradient(90deg, rgba(11, 15, 25, 0.8) 0%, rgba(11, 15, 25, 0.45) 55%, rgba(11, 15, 25, 0.1) 100%);
            --weekend-color: #f87171;
            --today-bg: rgba(239, 68, 68, 0.35);
            --today-border: #ef4444;
            --today-text: #ffffff;
        }

        /* Dynamic High-Contrast Light Theme (See-Through Glassmorphic for bright backgrounds) */
        body.theme-light {
            --text-main: #0f172a;
            --text-sub: #1e293b;
            --text-accent: #0284c7;
            --text-muted: #475569;
            --card-bg: rgba(255, 255, 255, 0.55); /* See-through glass light */
            --card-border: rgba(0, 0, 0, 0.18);
            --player-bg: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(255, 255, 255, 0.4);
            --btn-bg: rgba(2, 132, 199, 0.2);
            --btn-border: rgba(2, 132, 199, 0.5);
            --btn-text: #0284c7;
            --overlay-gradient: linear-gradient(90deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.4) 55%, rgba(255, 255, 255, 0.05) 100%);
            --weekend-color: #dc2626;
            --today-bg: rgba(220, 38, 38, 0.25);
            --today-border: #dc2626;
            --today-text: #7f1d1d;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: #0b0f19;
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out, color 0.3s ease;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-gradient);
            z-index: 0;
            transition: background 0.3s ease;
        }

        .main-container {
            position: absolute;
            top: 50%;
            left: 3%;
            transform: translateY(-50%);
            z-index: 1;
            text-align: left;
            width: 62%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-container {
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #clock {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--text-main);
        }

        #date {
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 4px;
            color: var(--text-sub);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            background: var(--player-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            padding: 5px 8px;
            border-radius: 6px;
            width: 100%;
        }

        .music-player input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-main);
            font-size: 0.75rem;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .music-player input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .music-player button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            width: 28px;
            height: 26px;
            color: var(--btn-text);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .music-player button:hover {
            opacity: 0.85;
        }

        .music-player button.active {
            background: var(--text-accent);
            border-color: var(--text-accent);
            color: #ffffff;
            box-shadow: 0 0 8px var(--text-accent);
        }

        #hidden-player-slot {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .calendar-year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
        }

        /* See-Through Glassmorphic Month Cards */
        .month-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 6px 8px;
            text-align: left;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .month-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3px;
            color: var(--text-accent);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .weekdays-row, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.58rem;
            text-align: center;
        }

        .weekdays-row div {
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 3px;
        }

        .weekdays-row div:nth-child(6), 
        .weekdays-row div:nth-child(7) {
            color: var(--weekend-color);
        }

        .days-grid div {
            padding: 1.5px 0;
            margin: 0.5px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .days-grid .weekend {
            color: var(--weekend-color);
            font-weight: 700;
        }

        .days-grid .empty {
            visibility: hidden;
        }

        .days-grid .today {
            border: 1.5px solid var(--today-border);
            border-radius: 50%;
            background: var(--today-bg);
            color: var(--today-text);
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="main-container">
        <div class="clock-container">
            <div id="clock">00:00:00</div>
            <div id="date">Loading...</div>
        </div>

        <div class="music-player">
            <input type="text" id="youtube-url" placeholder="Paste YouTube link here...">
            <button onclick="playAudioStream()" title="Play">▶</button>
            <button onclick="toggleLoop()" id="loop-btn" class="active" title="Toggle Loop">🔁</button>
            <button onclick="stopAudioStream()" title="Stop">⏹</button>
            <button onclick="nextArtworkManual()" title="Next Wallpaper">🖼️</button>
        </div>

        <div class="calendar-year-grid" id="year-calendar"></div>
    </div>

    <canvas id="color-canvas" style="display:none;"></canvas>

    <div id="hidden-player-slot"></div>

    <script>
        // Full list of 24 renamed wallpapers
        const rawArtworkList = [
            'dabimyhero.png',
            'wallpaper 0001 (1).jpg',
            'wallpaper 0001 (2).jpg',
            'wallpaper 0001 (3).jpg',
            'wallpaper 0001 (4).jpg',
            'wallpaper 0001 (5).jpg',
            'wallpaper 0001 (6).jpg',
            'wallpaper 0001 (7).jpg',
            'wallpaper 0001 (8).jpg',
            'wallpaper 0001 (9).jpg',
            'wallpaper 0001 (10).jpg',
            'wallpaper 0001 (11).jpg',
            'wallpaper 002 (1).png',
            'wallpaper 002 (2).png',
            'wallpaper 002 (3).png',
            'wallpaper 002 (4).png',
            'wallpaper 002 (5).png',
            'wallpaper 002 (6).png',
            'wallpaper 002 (7).png',
            'wallpaper 002 (8).png',
            'wallpaper 002 (9).png',
            'wallpaper 002 (10).png',
            'wallpaper 002 (11).png',
            'wallpaper 002 (12).png'
        ];

        // Format names safely for URLs (handles spaces and parentheses)
        const artworkList = rawArtworkList.map(name => encodeURI(name));

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Persistent Shuffle Deck (Cycles without repeats across reloads and clicks)
        function getNextArtwork() {
            let queue = [];
            try {
                const savedQueue = localStorage.getItem('wallpaper_deck_v2');
                if (savedQueue) {
                    queue = JSON.parse(savedQueue);
                }
            } catch (e) {
                queue = [];
            }

            if (!Array.isArray(queue) || queue.length === 0) {
                queue = shuffle(artworkList);
            }

            const nextImg = queue.pop();
            localStorage.setItem('wallpaper_deck_v2', JSON.stringify(queue));
            return nextImg;
        }

        // Dynamic Contrast Detection via Canvas
        function applyArtwork(imageSrc) {
            document.body.style.backgroundImage = `url('${imageSrc}')`;
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imageSrc;

            img.onload = function() {
                try {
                    const canvas = document.getElementById('color-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100;
                    canvas.height = 100;

                    // Sample the left half of the image
                    ctx.drawImage(img, 0, 0, img.width * 0.5, img.height, 0, 0, 100, 100);
                    const imgData = ctx.getImageData(0, 0, 100, 100).data;

                    let totalR = 0, totalG = 0, totalB = 0, count = 0;

                    for (let i = 0; i < imgData.length; i += 4) {
                        totalR += imgData[i];
                        totalG += imgData[i + 1];
                        totalB += imgData[i + 2];
                        count++;
                    }

                    const avgR = totalR / count;
                    const avgG = totalG / count;
                    const avgB = totalB / count;

                    // Relative luminance formula (ITU-R BT.709)
                    const brightness = (avgR * 0.2126) + (avgG * 0.7152) + (avgB * 0.0722);

                    if (brightness > 130) {
                        document.body.classList.add('theme-light');
                    } else {
                        document.body.classList.remove('theme-light');
                    }
                } catch (e) {
                    console.log("Canvas contrast active.");
                }
            };
        }

        function nextArtworkManual() {
            applyArtwork(getNextArtwork());
        }

        // Auto-switch wallpaper every 10 minutes (600,000 ms)
        setInterval(() => {
            applyArtwork(getNextArtwork());
        }, 10 * 60 * 1000);

        // Clock and Calendar Updater
        function updateClockAndCalendar() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, dateOptions);

            generateFullYearCalendar(now);
        }

        function generateFullYearCalendar(currentDate) {
            const yearContainer = document.getElementById('year-calendar');
            if (yearContainer.children.length > 0) return;

            const year = currentDate.getFullYear();
            const currentMonthIndex = currentDate.getMonth();
            const currentDayNum = currentDate.getDate();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dayHeaders = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

            let htmlContent = '';

            for (let m = 0; m < 12; m++) {
                htmlContent += `<div class="month-card">`;
                htmlContent += `<div class="month-title">${monthNames[m]}</div>`;
                
                htmlContent += `<div class="weekdays-row">`;
                dayHeaders.forEach(d => htmlContent += `<div>${d}</div>`);
                htmlContent += `</div>`;

                htmlContent += `<div class="days-grid">`;

                let firstDayIndex = new Date(year, m, 1).getDay();
                firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

                let totalDays = new Date(year, m + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    htmlContent += `<div class="empty"></div>`;
                }

                for (let d = 1; d <= totalDays; d++) {
                    let dayOfWeek = (firstDayIndex + d - 1) % 7;
                    let isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
                    let isToday = (m === currentMonthIndex && d === currentDayNum);

                    let classes = [];
                    if (isWeekend) classes.push('weekend');
                    if (isToday) classes.push('today');

                    let classString = classes.length > 0 ? `class="${classes.join(' ')}"` : '';
                    
                    htmlContent += `<div ${classString}>${d}</div>`;
                }

                htmlContent += `</div></div>`;
            }

            yearContainer.innerHTML = htmlContent;
        }

        // Hidden Audio Player Engine
        let isLoopEnabled = true;

        function extractYouTubeId(url) {
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            }
            return videoId;
        }

        function toggleLoop() {
            isLoopEnabled = !isLoopEnabled;
            const loopBtn = document.getElementById('loop-btn');
            if (isLoopEnabled) {
                loopBtn.classList.add('active');
            } else {
                loopBtn.classList.remove('active');
            }
            
            const ytUrl = document.getElementById('youtube-url').value.trim();
            if (ytUrl && document.getElementById('hidden-player-slot').innerHTML !== '') {
                playAudioStream();
            }
        }

        function playAudioStream() {
            const ytUrl = document.getElementById('youtube-url').value.trim();
            const videoId = extractYouTubeId(ytUrl);
            const slot = document.getElementById('hidden-player-slot');

            if (!videoId) {
                alert("Please paste a valid YouTube link.");
                return;
            }

            const loopParams = isLoopEnabled ? `&loop=1&playlist=${videoId}` : `&loop=0`;
            
            slot.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1${loopParams}" 
                    allow="autoplay" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function stopAudioStream() {
            document.getElementById('hidden-player-slot').innerHTML = '';
        }

        // Run immediately on page load
        applyArtwork(getNextArtwork());
        setInterval(updateClockAndCalendar, 1000);
        updateClockAndCalendar();
    </script>
</body>
</html>
