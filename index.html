<!-- Server Services Telemetry Bar (Icon-Only Compact Layout) -->
        <div id="server-telemetry-container" style="display: none; margin-top: 8px; font-family: monospace;">
            <div style="display: flex; gap: 8px; justify-content: flex-start; align-items: center;" id="service-pills">
                <!-- Compact Icon Badges Render Here -->
            </div>
            
            <div style="display: flex; gap: 6px; justify-content: flex-start; margin-top: 6px;">
                <button onclick="toggleLogDrawer()" style="background: rgba(0,0,0,0.4); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px;">📋 Logs</button>
                <button onclick="triggerRollback()" style="background: rgba(185,28,28,0.3); color: #f87171; border: 1px solid rgba(239,68,68,0.5); border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 10px;">↺ Rollback</button>
                <a href="http://192.168.0.20:8088/generate-rebuild" download="bootstrap_restore.sh" style="text-decoration: none; background: rgba(16,185,129,0.25); color: #34d399; border: 1px solid rgba(16,185,129,0.5); border-radius: 4px; padding: 2px 6px; font-size: 10px; display: inline-flex; align-items: center;">⚡ Rebuild</a>
            </div>

            <!-- Collapsible Live Log Terminal Drawer -->
            <div id="log-drawer" style="display: none; margin-top: 6px; background: rgba(10, 15, 25, 0.92); border: 1px solid var(--card-border); border-radius: 6px; padding: 6px; max-height: 150px; overflow-y: auto; text-align: left; color: #4ade80;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 3px; margin-bottom: 4px;">
                    <span id="log-title" style="font-size: 10px; color: var(--text-sub);">Live Stream</span>
                    <select id="log-selector" onchange="switchLogStream(this.value)" style="background: #111; color: #fff; border: 1px solid var(--card-border); font-size: 10px; border-radius: 3px;">
                        <option value="ai-agent">🤖 ai-agent</option>
                        <option value="nas-samba">📁 nas-samba</option>
                        <option value="jellyfin">🎬 jellyfin</option>
                        <option value="aria2">⬇️ aria2</option>
                        <option value="system">☁️ google-drive-sync / system</option>
                    </select>
                </div>
                <pre id="log-stream-output" style="margin: 0; white-space: pre-wrap; font-size: 9.5px; font-family: monospace;"></pre>
            </div>
        </div>
