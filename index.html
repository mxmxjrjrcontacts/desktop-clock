<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Anime Wallpaper Clock & Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Pure 100% See-Through Dark Contrast */
            --text-main: #ffffff;
            --text-sub: #f1f5f9;
            --text-accent: #38bdf8;
            --text-muted: #cbd5e1;
            --card-border: rgba(255, 255, 255, 0.35);
            --input-bg: rgba(0, 0, 0, 0.35);
            --btn-bg: rgba(56, 189, 248, 0.25);
            --btn-border: rgba(56, 189, 248, 0.6);
            --btn-text: #38bdf8;
            --weekend-color: #f87171;
            --today-bg: rgba(239, 68, 68, 0.45);
            --today-border: #ef4444;
            --today-text: #ffffff;
            --text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.8);
        }

        /* Pure 100% See-Through Light Contrast */
        body.theme-light {
            --text-main: #0f172a;
            --text-sub: #0f172a;
            --text-accent: #0369a1;
            --text-muted: #334155;
            --card-border: rgba(15, 23, 42, 0.35);
            --input-bg: rgba(255, 255, 255, 0.45);
            --btn-bg: rgba(2, 132, 199, 0.25);
            --btn-border: rgba(2, 132, 199, 0.6);
            --btn-text: #0284c7;
            --weekend-color: #b91c1c;
            --today-bg: rgba(220, 38, 38, 0.3);
            --today-border: #b91c1c;
            --today-text: #7f1d1d;
            --text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 255, 255, 0.8);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: #0b0f19;
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out, color 0.3s ease;
        }

        /* Main Container: Restricted to ~33% width (1/3 of the screen) */
        .main-container {
            position: absolute;
            top: 50%;
            left: 2.5%;
            transform: translateY(-50%);
            z-index: 1;
            text-align: left;
            width: 33%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .clock-container {
            margin-bottom: 6px;
            text-shadow: var(--text-shadow);
        }

        #clock {
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--text-main);
            text-shadow: var(--text-shadow);
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        #clock-ampm {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-accent);
        }

        #date {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 3px;
            color: var(--text-sub);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: var(--text-shadow);
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            background: transparent;
            border: 1px solid var(--card-border);
            padding: 4px 6px;
            border-radius: 6px;
            width: 100%;
        }

        .music-player input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 3px 6px;
            color: var(--text-main);
            font-size: 0.7rem;
            font-weight: 600;
            outline: none;
            text-shadow: var(--text-shadow);
            min-width: 0;
        }

        .music-player input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .music-player button {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 4px;
            width: 24px;
            height: 22px;
            color: var(--btn-text);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .music-player button:hover {
            opacity: 0.85;
        }

        .music-player button.active {
            background: var(--text-accent);
            border-color: var(--text-accent);
            color: #ffffff;
            box-shadow: 0 0 6px var(--text-accent);
        }

        #hidden-player-slot {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* 3 Columns x 4 Rows for narrow 1/3 layout */
        .calendar-year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 100%;
        }

        /* 100% See-Through Cards */
        .month-card {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid var(--card-border);
            border-radius: 5px;
            padding: 4px 5px;
            text-align: left;
            transition: border-color 0.3s ease;
        }

        .month-title {
            font-size: 0.62rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2px;
            color: var(--text-accent);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: var(--text-shadow);
        }

        .weekdays-row, .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 0.48rem;
            text-align: center;
        }

        .weekdays-row div {
            font-weight: 800;
            color: var(--text-muted);
            padding-bottom: 2px;
            text-shadow: var(--text-shadow);
        }

        .weekdays-row div:nth-child(6), 
        .weekdays-row div:nth-child(7) {
            color: var(--weekend-color);
            text-shadow: var(--text-shadow);
        }

        .days-grid div {
            padding: 1px 0;
            margin: 0.2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.48rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: var(--text-shadow);
        }

        .days-grid .weekend {
            color: var(--weekend-color);
            font-weight: 800;
            text-shadow: var(--text-shadow);
        }

        .days-grid .empty {
            visibility: hidden;
        }

        .days-grid .today {
            border: 1px solid var(--today-border);
            border-radius: 50%;
            background: var(--today-bg);
            color: var(--today-text);
            font-weight: 900;
            text-shadow: var(--text-shadow);
        }

        /* Server Hub Hover & Slide Elements */
        @keyframes serverPulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); opacity: 1; }
            50% { box-shadow: 0 0 8px 3px rgba(16, 185, 129, 0.4); opacity: 0.7; }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); opacity: 1; }
        }

        @keyframes alertBlink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .server-pulse-ok {
            animation: serverPulse 2s infinite ease-in-out;
        }

        .server-pulse-warn {
            animation: alertBlink 1.2s infinite ease-in-out;
        }

        .hub-container {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            font-family: monospace;
            position: relative;
        }

        .hub-slider {
            display: flex;
            align-items: center;
            gap: 5px;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin-left 0.3s ease;
            margin-left: 0;
            pointer-events: none;
        }

        /* Slide to right on hovering either the server hub icon or the slide itself */
        .hub-container:hover .hub-slider {
            max-width: 420px;
            opacity: 1;
            margin-left: 8px;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="clock-container">
            <div id="clock">
                <span id="clock-time">12:00:00</span>
                <span id="clock-ampm">AM</span>
            </div>
            <div id="date">Loading...</div>
        </div>

        <div class="music-player">
            <input type="text" id="youtube-url" placeholder="YouTube link...">
            <button onclick="playAudioStream()" title="Play">▶</button>
            <button onclick="toggleLoop()" id="loop-btn" class="active" title="Toggle Loop">🔁</button>
            <button onclick="stopAudioStream()" title="Stop">⏹</button>
            <button onclick="nextArtworkManual()" title="Next Wallpaper">🖼️</button>
        </div>

        <div class="calendar-year-grid" id="year-calendar"></div>

        <!-- Hover-Activated Server Hub Bar -->
        <div id="server-telemetry-container" style="display: none;">
            <div class="hub-container">
                <!-- Master Server Icon Badge -->
                <div id="master-server-btn" class="server-pulse-ok" style="position: relative; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: rgba(16, 185, 129, 0.2); border: 1.5px solid #10b981; font-size: 14px; cursor: pointer; user-select: none;">
                    <span>🖥️</span>
                    <div id="master-alert-tag" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 9px; font-weight: 800; border-radius: 50%; min-width: 14px; height: 14px; padding: 0 2px; align-items: center; justify-content: center; border: 1px solid #fff;">0</div>
                </div>

                <!-- Slidable Strip (Hidden by default, expands to the right on hover) -->
                <div class="hub-slider">
                    <!-- Service Pills (🤖 📁 🎬 ⬇️ ☁️) -->
                    <div id="service-pills" style="display: flex; gap: 5px; align-items: center;"></div>

                    <span style="color: var(--card-border); font-size: 12px; margin: 0 2px;">|</span>

                    <!-- Action Controls -->
                    <button onclick="toggleLogDrawer()" title="View container & system live logs" style="background: rgba(0,0,0,0.4); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; justify-content: center;">📋</button>
                    
                    <button onclick="triggerRollback()" title="Rollback stack 1 snapshot backwards" style="background: rgba(185,28,28,0.25); color: #f87171; border: 1px solid rgba(239,68,68,0.5); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; justify-content: center;">↺</button>
                    
                    <button onclick="triggerSecureRebuild()" title="Rebuild server stack (requires SSH password verification)" style="background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.5); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; justify-content: center;">⚡</button>
                </div>
            </div>

            <!-- Collapsible Live Log Terminal Drawer -->
            <div id="log-drawer" style="display: none; margin-top: 6px; background: rgba(10, 15, 25, 0.95); border: 1px solid var(--card-border); border-radius: 6px; padding: 6px; max-height: 150px; overflow-y: auto; text-align: left; color: #4ade80;">
                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 3px; margin-bottom: 4px;">
                    <span id="log-title" style="font-size: 10px; color: var(--text-sub);">Live Stream</span>
                    <select id="log-selector" onchange="switchLogStream(this.value)" style="background: #111; color: #fff; border: 1px solid var(--card-border); font-size: 10px; border-radius: 3px;">
                        <option value="ai-agent">🤖 ai-agent</option>
                        <option value="nas-samba">📁 nas-samba</option>
                        <option value="jellyfin">🎬 jellyfin</option>
                        <option value="aria2">⬇️ aria2</option>
                        <option value="google-drive-sync">☁️ google-drive-sync</option>
                        <option value="system">🖥️ system log</option>
                    </select>
                </div>
                <pre id="log-stream-output" style="margin: 0; white-space: pre-wrap; font-size: 9.5px; font-family: monospace;"></pre>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Contrast Detection -->
    <canvas id="color-canvas" style="display:none;"></canvas>

    <!-- Offscreen Player Slot -->
    <div id="hidden-player-slot"></div>

    <script>
        // Clean array containing dabimyhero.png, wallpaper 0001 (1)-(11), and wallpaper 002 (1)-(81)
        const rawArtworkList = [
            'dabimyhero.png',
            'wallpaper 0001 (1).jpg',
            'wallpaper 0001 (2).jpg',
            'wallpaper 0001 (3).jpg',
            'wallpaper 0001 (4).jpg',
            'wallpaper 0001 (5).jpg',
            'wallpaper 0001 (6).jpg',
            'wallpaper 0001 (7).jpg',
            'wallpaper 0001 (8).jpg',
            'wallpaper 0001 (9).jpg',
            'wallpaper 0001 (10).jpg',
            'wallpaper 0001 (11).jpg'
        ];

        // Dynamically add all wallpaper 002 (1) through (81)
        for (let i = 1; i <= 81; i++) {
            rawArtworkList.push(`wallpaper 002 (${i}).png`);
        }

        const artworkList = rawArtworkList.map(name => encodeURI(name));

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextArtwork() {
            let queue = [];
            try {
                const savedQueue = localStorage.getItem('wallpaper_deck_v3');
                if (savedQueue) {
                    queue = JSON.parse(savedQueue);
                }
            } catch (e) {
                queue = [];
            }

            if (!Array.isArray(queue) || queue.length === 0) {
                queue = shuffle(artworkList);
            }

            const nextImg = queue.pop();
            localStorage.setItem('wallpaper_deck_v3', JSON.stringify(queue));
            return nextImg;
        }

        function applyArtwork(imageSrc) {
            document.body.style.backgroundImage = `url('${imageSrc}')`;
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imageSrc;

            img.onload = function() {
                try {
                    const canvas = document.getElementById('color-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100;
                    canvas.height = 100;

                    ctx.drawImage(img, 0, 0, img.width * 0.35, img.height, 0, 0, 100, 100);
                    const imgData = ctx.getImageData(0, 0, 100, 100).data;

                    let totalR = 0, totalG = 0, totalB = 0, count = 0;

                    for (let i = 0; i < imgData.length; i += 4) {
                        totalR += imgData[i];
                        totalG += imgData[i + 1];
                        totalB += imgData[i + 2];
                        count++;
                    }

                    const avgR = totalR / count;
                    const avgG = totalG / count;
                    const avgB = totalB / count;

                    const brightness = (avgR * 0.2126) + (avgG * 0.7152) + (avgB * 0.0722);

                    if (brightness > 130) {
                        document.body.classList.add('theme-light');
                    } else {
                        document.body.classList.remove('theme-light');
                    }
                } catch (e) {
                    console.log("Canvas contrast active.");
                }
            };
        }

        function nextArtworkManual() {
            applyArtwork(getNextArtwork());
        }

        setInterval(() => {
            applyArtwork(getNextArtwork());
        }, 10 * 60 * 1000);

        function updateClockAndCalendar() {
            const now = new Date();
            
            let rawHours = now.getHours();
            const ampm = rawHours >= 12 ? 'PM' : 'AM';
            let hours = rawHours % 12 || 12;
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
            document.getElementById('clock-ampm').innerText = ampm;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, dateOptions);

            generateFullYearCalendar(now);
        }

        function generateFullYearCalendar(currentDate) {
            const yearContainer = document.getElementById('year-calendar');
            if (yearContainer.children.length > 0) return;

            const year = currentDate.getFullYear();
            const currentMonthIndex = currentDate.getMonth();
            const currentDayNum = currentDate.getDate();
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dayHeaders = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

            let htmlContent = '';

            for (let m = 0; m < 12; m++) {
                htmlContent += `<div class="month-card">`;
                htmlContent += `<div class="month-title">${monthNames[m]}</div>`;
                
                htmlContent += `<div class="weekdays-row">`;
                dayHeaders.forEach(d => htmlContent += `<div>${d}</div>`);
                htmlContent += `</div>`;

                htmlContent += `<div class="days-grid">`;

                let firstDayIndex = new Date(year, m, 1).getDay();
                firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

                let totalDays = new Date(year, m + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    htmlContent += `<div class="empty"></div>`;
                }

                for (let d = 1; d <= totalDays; d++) {
                    let dayOfWeek = (firstDayIndex + d - 1) % 7;
                    let isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
                    let isToday = (m === currentMonthIndex && d === currentDayNum);

                    let classes = [];
                    if (isWeekend) classes.push('weekend');
                    if (isToday) classes.push('today');

                    let classString = classes.length > 0 ? `class="${classes.join(' ')}"` : '';
                    
                    htmlContent += `<div ${classString}>${d}</div>`;
                }

                htmlContent += `</div></div>`;
            }

            yearContainer.innerHTML = htmlContent;
        }

        let isLoopEnabled = true;

        function extractYouTubeId(url) {
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1]?.split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1]?.split('&')[0];
            } else if (url.includes('embed/')) {
                videoId = url.split('embed/')[1]?.split('?')[0];
            }
            return videoId;
        }

        function toggleLoop() {
            isLoopEnabled = !isLoopEnabled;
            const loopBtn = document.getElementById('loop-btn');
            if (isLoopEnabled) {
                loopBtn.classList.add('active');
            } else {
                loopBtn.classList.remove('active');
            }
            
            const ytUrl = document.getElementById('youtube-url').value.trim();
            if (ytUrl && document.getElementById('hidden-player-slot').innerHTML !== '') {
                playAudioStream();
            }
        }

        function playAudioStream() {
            const ytUrl = document.getElementById('youtube-url').value.trim();
            const videoId = extractYouTubeId(ytUrl);
            const slot = document.getElementById('hidden-player-slot');

            if (!videoId) {
                alert("Please paste a valid YouTube link.");
                return;
            }

            const loopParams = isLoopEnabled ? `&loop=1&playlist=${videoId}` : `&loop=0`;
            
            slot.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1${loopParams}" 
                    allow="autoplay" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function stopAudioStream() {
            document.getElementById('hidden-player-slot').innerHTML = '';
        }

        applyArtwork(getNextArtwork());
        setInterval(updateClockAndCalendar, 1000);
        updateClockAndCalendar();
    </script>

    <!-- Telemetry Client Script -->
    <script>
    (function() {
        const SERVER_API = "http://192.168.0.20:8088";
        let eventSource = null;

        const serviceIcons = {
            'ai-agent': '🤖',
            'nas-samba': '📁',
            'jellyfin': '🎬',
            'aria2': '⬇️',
            'google-drive-sync': '☁️'
        };

        async function checkLaptopAndInit() {
            if (!localStorage.getItem('isMasterLaptop')) {
                if (window.location.search.includes('enable_server=1')) {
                    localStorage.setItem('isMasterLaptop', 'true');
                } else {
                    return;
                }
            }

            try {
                const ping = await fetch(`${SERVER_API}/health`, { method: "GET", mode: "cors" });
                const data = await ping.json();
                if (data.status === "ok") {
                    document.getElementById("server-telemetry-container").style.display = "block";
                    refreshServices();
                    setInterval(refreshServices, 10000);
                }
            } catch (e) {
                document.getElementById("server-telemetry-container").style.display = "none";
            }
        }

        async function refreshServices() {
            try {
                const res = await fetch(`${SERVER_API}/status`);
                const services = await res.json();
                const container = document.getElementById("service-pills");
                container.innerHTML = "";

                let issueCount = 0;
                let hasRed = false;

                for (const [name, meta] of Object.entries(services)) {
                    const icon = serviceIcons[name] || '⚙️';
                    const isWarn = meta.badge === "yellow";
                    const isErr = meta.badge === "red";
                    
                    if (isWarn || isErr) {
                        issueCount++;
                        if (isErr) hasRed = true;
                    }

                    const borderColor = isErr ? "#ef4444" : (isWarn ? "#f59e0b" : "#10b981");
                    const bgColor = isErr ? "rgba(239, 68, 68, 0.3)" : (isWarn ? "rgba(245, 158, 11, 0.3)" : "rgba(16, 185, 129, 0.25)");

                    const pill = document.createElement("div");
                    pill.style = `
                        position: relative;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 26px;
                        height: 26px;
                        border-radius: 6px;
                        background: ${bgColor};
                        border: 1.5px solid ${borderColor};
                        font-size: 13px;
                        cursor: pointer;
                        user-select: none;
                        transition: transform 0.15s ease;
                    `;
                    pill.title = `${name.toUpperCase()}\nStatus: ${meta.detail}\n${isWarn || isErr ? "Click to restart" : "Click to view logs"}`;
                    pill.innerHTML = `<span>${icon}</span>${isWarn || isErr ? '<span style="position:absolute; top:-3px; right:-3px; font-size:9px;">⚠️</span>' : ''}`;
                    
                    pill.onclick = async (e) => {
                        e.stopPropagation();
                        if (isWarn || isErr) {
                            const wantRestart = confirm(`[ALERT] ${name.toUpperCase()} has an issue:\n${meta.detail}\n\nDo you want to restart it now?`);
                            if (wantRestart) {
                                try {
                                    const restartRes = await fetch(`${SERVER_API}/restart-service`, {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ service: name })
                                    });
                                    const out = await restartRes.json();
                                    alert(out.message || "Restart command dispatched.");
                                    setTimeout(refreshServices, 2500);
                                    return;
                                } catch (err) {
                                    alert("Could not trigger restart: " + err.message);
                                }
                            }
                        }

                        document.getElementById("log-selector").value = name;
                        const drawer = document.getElementById("log-drawer");
                        if (drawer.style.display !== "block") {
                            toggleLogDrawer();
                        } else {
                            switchLogStream(document.getElementById("log-selector").value);
                        }
                    };
                    container.appendChild(pill);
                }

                const masterBtn = document.getElementById("master-server-btn");
                const alertTag = document.getElementById("master-alert-tag");

                if (issueCount === 0) {
                    masterBtn.className = "server-pulse-ok";
                    masterBtn.style.background = "rgba(16, 185, 129, 0.2)";
                    masterBtn.style.border = "1.5px solid #10b981";
                    masterBtn.title = "All Server Services Healthy (Hover to inspect)";
                    alertTag.style.display = "none";
                } else {
                    masterBtn.className = "server-pulse-warn";
                    masterBtn.style.background = hasRed ? "rgba(239, 68, 68, 0.3)" : "rgba(245, 158, 11, 0.3)";
                    masterBtn.style.border = hasRed ? "1.5px solid #ef4444" : "1.5px solid #f59e0b";
                    masterBtn.title = `${issueCount} Service Issue(s) Detected! Hover to resolve.`;
                    alertTag.style.display = "flex";
                    alertTag.style.background = hasRed ? "#ef4444" : "#f59e0b";
                    alertTag.innerText = issueCount;
                }
            } catch (err) {}
        }

        window.toggleLogDrawer = function() {
            const el = document.getElementById("log-drawer");
            el.style.display = el.style.display === "none" ? "block" : "none";
            if (el.style.display === "block") {
                switchLogStream(document.getElementById("log-selector").value);
            } else if (eventSource) {
                eventSource.close();
            }
        };

        window.switchLogStream = function(service) {
            if (eventSource) eventSource.close();
            const output = document.getElementById("log-stream-output");
            output.innerText = `[Connecting live feed for ${service}...]\n`;
            eventSource = new EventSource(`${SERVER_API}/logs/stream?service=${service}`);
            eventSource.onmessage = function(e) {
                output.innerText += JSON.parse(e.data) + "\n";
                output.parentElement.scrollTop = output.parentElement.scrollHeight;
            };
        };

        window.triggerRollback = async function() {
            if (!confirm("Rollback containers to previous snapshot?")) return;
            const res = await fetch(`${SERVER_API}/rollback`, { method: "POST" });
            const result = await res.json();
            alert(result.success ? `Rollback Successful: ${result.restored}` : `Rollback Failed`);
        };

        window.triggerSecureRebuild = async function() {
            const proceed = confirm(
                "WARNING: REBUILD SCRIPT GENERATOR\n\n" +
                "This function generates an automated migration & deployment script\n" +
                "to stand up this entire server stack from scratch on a new machine.\n\n" +
                "Do you want to authenticate and download this script?"
            );
            if (!proceed) return;

            const password = prompt("Enter SSH password for 'max':");
            if (!password) return;

            try {
                const res = await fetch(`${SERVER_API}/verify-and-rebuild`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password: password })
                });

                const data = await res.json();
                if (data.success) {
                    const blob = new Blob([data.script], { type: "text/x-shellscript" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "bootstrap_restore.sh";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    alert("Authentication successful. 'bootstrap_restore.sh' has been downloaded.");
                } else {
                    alert("Authentication Failed: " + (data.error || "Incorrect password."));
                }
            } catch (err) {
                alert("Error communicating with server agent.");
            }
        };

        checkLaptopAndInit();
    })();
    </script>
</body>
</html>
